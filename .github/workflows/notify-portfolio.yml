# ============================================================
# push 之后通知 my-portfolio 重新构建部署。
#
# 配置步骤：
#   1. 建一个 Personal Access Token
#      - Fine-grained token，Repository access 选 Shinyleaf798/my-portfolio
#      - 权限：Contents = Read-only，Actions = Read and write
#   2. 在本仓库 Settings → Secrets and variables → Actions
#      新建 secret，名字 PORTFOLIO_DISPATCH_TOKEN，值为上面的 token
#   3. 想先验证 token 通不通，用 Actions 页面的 "Run workflow" 手动跑一次
# ============================================================
name: Notify portfolio

on:
  push:
    branches: [main]
    # 只有内容变动才触发，改 README / hook 不会白跑一次构建
    paths:
      - 'notes/**'
      - 'news/**'
      - 'project/**'
  # 不 push 也能手动跑一次，用来验证 token
  workflow_dispatch:

# 这个 job 不需要动本仓库任何东西
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio rebuild
        env:
          # 走 env 而不是直接内插进 run，避免 secret 出现在命令行文本里
          TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PORTFOLIO_DISPATCH_TOKEN 没有设置"
            exit 1
          fi

          # curl 默认对 4xx/5xx 也返回退出码 0 —— 不显式检查状态码的话，
          # token 过期会让这个 job 一直是绿的，而 portfolio 再也不会更新。
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Shinyleaf798/my-portfolio/dispatches \
            -d '{"event_type":"content-updated"}')

          if [ "$status" != "204" ]; then
            echo "::error::触发失败 (HTTP $status)"
            echo "--- 响应内容 ---"
            cat response.txt
            echo
            echo "401/404 基本都是 token 问题：过期了、"
            echo "Repository access 没选 my-portfolio、或者 Actions 权限不是 Read and write。"
            exit 1
          fi

          echo "已通知 my-portfolio 重新构建 (HTTP 204)"
